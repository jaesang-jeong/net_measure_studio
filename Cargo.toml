[package]
name = "net_measure_studio"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default"] }
egui_plot = "0.29"
egui = "0.29"
tokio = { version = "1.40", features = ["full"] }
crossbeam-channel = "0.5"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.31"
rand = "0.8"
